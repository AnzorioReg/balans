plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.anzor.balans'
    compileSdk 36
    defaultConfig {
        applicationId "com.anzor.balans"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('BALANS_VERSION_CODE') ?: '17')
        versionName "1.17"
    }
    signingConfigs {
        stableDebug {
            def keyPath = System.getenv('BALANS_STORE_FILE')
            if (keyPath) {
                storeFile rootProject.file(keyPath)
                storePassword System.getenv('BALANS_STORE_PASSWORD')
                keyAlias System.getenv('BALANS_KEY_ALIAS')
                keyPassword System.getenv('BALANS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('CI') == 'true' && !System.getenv('BALANS_STORE_FILE')) {
                throw new GradleException('CI requires the persistent Balans signing key; refusing a random debug signature.')
            }
            if (System.getenv('BALANS_STORE_FILE')) signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildFeatures { viewBinding true }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.1.20')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
