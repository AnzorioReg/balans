name: Retrieve APK failure diagnostics
on:
  workflow_dispatch:
  push:
    branches: [sync-auto-refresh]
    paths: [.github/workflows/diagnose-apk.yml]
permissions:
  actions: read
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sync-auto-refresh
      - name: Read failed build logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=28e47356e60f667e26ff2f9d3d19f61c37f2b0f6&per_page=30" --jq '.workflow_runs | map(select(.name == "Build APK")) | first | .id')
          test -n "$RUN" && test "$RUN" != null
          gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --json databaseId,url,status,conclusion,jobs > /tmp/apk-status.json
          gh run view "$RUN" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/apk-failure.txt
          mkdir -p build-diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          status=json.loads(Path('/tmp/apk-status.json').read_text())
          text=Path('/tmp/apk-failure.txt').read_text()
          text=re.sub(r'(?:gh[pousr]_[A-Za-z0-9_]+|github_pat_[A-Za-z0-9_]+)','[REDACTED]',text)
          text=re.sub(r'(?im)^.*(?:password|authorization:|access_token|storepass|keypass|KEY_BACKUP|BASE64).*$','[Sensitive line omitted]',text)
          lines=text.splitlines()
          errors=[line for line in lines if re.search(r'error|exception|failure|caused by|what went wrong|could not|cannot|failed',line,re.I)]
          report=json.dumps(status,ensure_ascii=False,indent=2)+'\n\nERROR EXTRACT\n'+'\n'.join(errors[-100:])+'\n\nFAILED LOG TAIL\n'+'\n'.join(lines[-160:])
          Path('build-diagnostics/latest.txt').write_text(report[-40000:],encoding='utf-8')
          PY
      - name: Save readable diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-diagnostics/latest.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record APK failure diagnostics [skip ci]'
            git push origin HEAD:sync-auto-refresh
          fi
