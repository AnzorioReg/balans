name: Apply fix batch 4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-batch-4.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create rollback tag
        run: |
          TAG=backup/pre-batch4-$(date +%Y%m%d-%H%M%S)
          git tag "$TAG"
          git push origin "$TAG"
          echo "ROLLBACK_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Apply batch 4 fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          if '<!-- fix-batch-4-v1 -->' in s:
              print('Already patched')
              raise SystemExit(0)
          script = """
<script id='batch4Fixes'>
(function(){
  const oldBigLegend=bigLegend;
  bigLegend=function(m,p){
    const base=oldBigLegend(m,p);
    if(m.id==='sleep'&&p&&p!=='day'){
      const rows=metricRecords(m,p);
      if(rows.length>1)return (base?base+' ':'')+'<span>Показаны отдельные сессии сна; усреднение фаз не выполняется.</span>';
    }
    return base;
  };
  const oldRenderHC=renderHC;
  renderHC=function(){
    oldRenderHC();
    const info=state.healthInfo||{},range=info.range||{};
    const host=document.querySelector('#srcCard')||document.querySelector('#v-sources');
    if(!host)return;
    let box=document.getElementById('hcCoverageBox');
    if(!box){box=document.createElement('div');box.id='hcCoverageBox';box.className='card';box.style.cssText='margin-top:12px;padding:12px';host.append(box)}
    const per=range.perMetricRange||{};
    const rows=Object.entries(per).map(([id,x])=>{
      const m=window.byId?.[id];if(!m)return '';
      return '<div class=\'drow\'><span class=\'k\'>'+esc(m.name)+'</span><span class=\'val num\'>'+(x.count||0)+' зап.</span></div>';
    }).join('');
    box.innerHTML='<b>Охват истории</b><p class=\'foot\'>Доступно '+(range.queriedDays??range.requestedDays||0)+' из '+(range.requestedDays||0)+' дней.'+(range.historyLimited?' Health Connect ограничил чтение старых записей.':'')+'</p>'+rows;
  };
  const oldTryBleAuto=window.tryBleAuto;
  window.tryBleAuto=function(){
    try{
      if(!navigator.bluetooth){toast('Bluetooth недоступен','Эта версия Android или оболочка не поддерживает Web Bluetooth.','i-info');return}
    }catch(e){}
    return oldTryBleAuto?.();
  };
})();
</script>
<!-- fix-batch-4-v1 -->
"""
          if '</body>' not in s:
              raise SystemExit('Closing body tag not found')
          s = s.replace('</body>', script + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Update FIXES.md
        run: |
          cat >> FIXES.md <<'EOF'

          ## Пакет 4 — сон, источники и Bluetooth

          - Уточнено отображение сна за длинные периоды: показываются отдельные сессии без искусственного усреднения фаз.
          - Добавлен блок охвата истории по показателям в «Источниках».
          - Добавлена диагностика доступности Bluetooth.
          - Перед изменениями создан тег отката: ${{ env.ROLLBACK_TAG }}.
          EOF
      - name: Commit batch 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html FIXES.md
          git commit -m "Improve sleep history, source coverage and Bluetooth diagnostics" || exit 0
          git push
