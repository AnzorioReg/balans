name: Apply Batch 14 assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-batch14-assets.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Link Batch 14 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          changed=False
          css_link='<link rel="stylesheet" href="batch14.css">'
          js_tag='<script src="batch14.js"></script>'
          if css_link not in s:
              s=s.replace('</head>',css_link+'\n</head>',1)
              changed=True
          if js_tag not in s:
              s=s.replace('</body>',js_tag+'\n</body>',1)
              changed=True
          if changed:
              p.write_text(s,encoding='utf-8')
          else:
              print('Already linked')
          PY
      - name: Commit linked assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/index.html
          git commit -m "Link Batch 14 assets" || exit 0
          git push
