name: Split final index part

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/split-part6.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split part 6
        run: |
          mkdir -p docs/index-parts/detail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('docs/index-parts/index-part-006.txt').read_text(encoding='utf-8')
          size = 20_000
          parts = [src[i:i+size] for i in range(0, len(src), size)]
          for i, part in enumerate(parts, 1):
              Path(f'docs/index-parts/detail/part6-{i:02}.txt').write_text(part, encoding='utf-8')
          print(f'Created {len(parts)} parts')
          PY
      - name: Commit parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index-parts/detail
          git commit -m "Split final index part" || exit 0
          git push
