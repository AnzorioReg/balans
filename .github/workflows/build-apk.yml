name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - sync-auto-refresh

permissions:
  contents: read
  issues: write

jobs:
  apk:
    uses: ./.github/workflows/stable-apk.yml
    with:
      appearance: true
    secrets: inherit
  publish:
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified APK artifact
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "balans-debug-$GITHUB_SHA" --dir dist
          APK=$(find dist -type f -name '*.apk' | head -n 1)
          test -n "$APK" && test -s "$APK"
          cp "$APK" "Balans-${GITHUB_SHA:0:8}.apk"
      - name: Publish downloadable APK
        run: |
          TAG="apk-$GITHUB_SHA"
          FILE="Balans-${GITHUB_SHA:0:8}.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Баланс APK ${GITHUB_SHA:0:8}" --notes "Сборка: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
  notify-failure:
    needs: [apk, publish]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create or update CI failure issue
        run: |
          TITLE="CI failure: Build APK"
          BODY=$(cat <<EOF
          ## Сборка APK не удалась

          - **Ветка:** `${GITHUB_REF_NAME}`
          - **Коммит:** `${GITHUB_SHA}`
          - **Запуск:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - **Время:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          Проверьте упавший job и лог. После исправления этот Issue можно закрыть.
          EOF
          )
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "ci-failure" --body "$BODY"
          fi
