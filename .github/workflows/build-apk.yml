name: Build debug APK

on:
  push:
    branches:
      - sync-auto-refresh
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Apply chart fixes safely
        shell: python
        run: |
          from pathlib import Path
          html = Path('app/src/main/assets/index.html')
          text = html.read_text(encoding='utf-8')
          marker = '</html>'
          if marker in text:
              text = text.split(marker, 1)[0] + marker
          period = Path('tools/period-chart-fix.js').read_text(encoding='utf-8')
          review = Path('tools/review-mode.js').read_text(encoding='utf-8')
          text += '\n<script>\n' + period + '\n' + review + '\n</script>\n'
          html.write_text(text, encoding='utf-8')

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
